[project]
name = "reconstruction-api"
version = "1.0.0"
description = "FastAPI backend + job worker for the photos-to-3D web app"
requires-python = ">=3.11,<3.13"
# One environment for local dev: `uv sync` installs the API + worker AND the reconstruction pipeline.
# Docker/CI still install requirements-api.txt and recon/requirements*.txt (keep pins in sync).
dependencies = [
    # API / worker
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    # Reconstruction pipeline (recon/requirements.txt)
    "numpy==2.4.6",
    "scipy==1.17.1",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pillow-heif==1.8.0",
    "pycolmap==4.2.1",
    "open3d==0.19.0",  # 0.20.0 returns empty TSDF meshes
    "trimesh==5.1.1",
    "xatlas==0.0.11",
    "usd-core==26.8",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "kornia==0.8.3",
    "transformers==5.18.0",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
    "timm==1.0.30",
    "einops==0.8.2",
    "accelerate==1.15.0",
    "addict==2.4.0",
    "omegaconf==2.3.1",
    "e3nn==0.6.0",
    "moviepy==1.0.3",
    "imageio==2.38.0",
    "matplotlib==3.11.2",
    "plyfile==1.1.5",
    "typer==0.27.2",
    "tqdm==4.70.1",
    # recon/requirements-nodeps.txt: their unneeded/conflicting deps are disabled below.
    "depth-anything-3==0.1.1",
    "evo==1.37.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'", "sys_platform == 'darwin'"]
# depth-anything-3 / evo declare numpy<2, xformers, gradio, opencv-python, ... that the inference
# path doesn't use (pip installs them with --no-deps). Pin numpy and switch the rest off.
override-dependencies = [
    "numpy==2.4.6",
    "opencv-python; sys_platform == 'never'",
    "xformers; sys_platform == 'never'",
    "pre-commit; sys_platform == 'never'",
    "argcomplete; sys_platform == 'never'",
    "colorama; sys_platform == 'never'",
    "natsort; sys_platform == 'never'",
    "numexpr; sys_platform == 'never'",
    "rosbags; sys_platform == 'never'",
    "seaborn; sys_platform == 'never'",
]

# CPU PyTorch on Linux/Windows (avoids multi-GB CUDA wheels); macOS PyPI wheels are already CPU/MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]
faulthandler_timeout = 120

[tool.ruff]
line-length = 135
target-version = "py311"
extend-exclude = ["recon"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

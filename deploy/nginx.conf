# Serves the built frontend and reverse-proxies /api to the FastAPI service.
upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large photo/video batches; the API enforces per-file limits (MAX_UPLOAD_MB).
    client_max_body_size 2g;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";  # upstream keepalive (SSE included)
    # NB: no proxy_set_header inside locations, or these inherited headers would be dropped.

    # Server-Sent Events: no buffering, long read timeout (the API sends keepalives every ~15 s).
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://api_upstream;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Uploads: stream request bodies to the API instead of spooling them in nginx.
    location ~ ^/api/projects/[^/]+/images$ {
        proxy_pass http://api_upstream;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_read_timeout 300s;
        # Large artifact downloads (Range requests pass through).
        proxy_max_temp_file_size 0;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
